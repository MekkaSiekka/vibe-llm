[pytest]
# Pytest configuration for vibe-llm

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    -v

# Markers for test organization
markers =
    unit: Unit tests that run fast with mocked dependencies
    integration: Integration tests that may require multiple components
    slow: Tests that take longer to run
    
# Asyncio configuration
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = models,detectors,service
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

